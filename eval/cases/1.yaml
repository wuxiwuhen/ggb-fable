  title: 将军饮马-二次函数
  problem: 抛物线 y = x^2 - (1/2)x - 3/2 与直线 y = x - 2 相交于 A、B 两点。点 E 在该抛物线的对称轴上，点 F 在 x 轴上，求 AE + EF + FB 的最小值。
  dimension: 2D
  topic: [二次函数, 将军饮马, 对称变换]
  difficulty: 3
  key_insight: 将军饮马——作 A 关于对称轴的对称点 A'、B 关于 x 轴的对称点 B'，则 AE+EF+FB 的最小值等于线段 A'B' 的长度。
